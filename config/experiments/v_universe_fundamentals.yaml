random_state: 42

universe:
  universe_file: external/universe/nifty464_universe.csv
  features:
    enabled:
      - fundamental  # ONLY fundamental features enabled
  membership_file: null
  use_membership: false

splits:
  train_start: "2015-01-01"
  valid_start: "2023-01-01"
  test_start: "2024-03-01"

trainer:
  model: lightgbm
  params:
    random_state: 42
    n_estimators: 1000
    learning_rate: 0.01
    max_depth: 4
    num_leaves: 16
    min_data_in_leaf: 500
    subsample: 0.7
    feature_fraction: 0.6
    reg_lambda: 10.0
    reg_alpha: 1.0

runtime:
  min_tickers: 2

backtest:
  top_k: 15
  hold_days: 10
  fee_bps: 1.0
  slippage_bps: 10.0
  cost_model: realistic

risk_filters:
  trend_fast: 50
  trend_slow: 200
  vol_lookback: 20
  vol_high: 0.04
  allow_high_vol: false
  allow_downtrend: false
  max_positions: 12
  cooldown_days: 2

meta_labeling:
  enabled: false

