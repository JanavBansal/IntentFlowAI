random_state: 42

universe:
  universe_file: external/universe/nifty464_universe.csv
  features:
    enabled:
      - technical
      - momentum
      - momentum_enhanced
      - volatility
      - atr
      - turnover
      - mean_reversion
      - mean_reversion_enhanced
      - volume_enhanced
      - ranking
      - fundamental
      - orthogonal
      - sector_relative
      - financial_ratios
      - sector_normalized
  membership_file: null
  use_membership: false

splits:
  train_start: "2015-01-01"
  valid_start: "2023-01-01"
  test_start: "2024-03-01"

trainer:
  model: lightgbm
  params:
    random_state: 42
    # Best HPT Params
    learning_rate: 0.03139602537838192
    num_leaves: 88
    max_depth: 6
    min_child_samples: 100
    subsample: 0.6963601935522751
    colsample_bytree: 0.5244201648101716
    reg_alpha: 8.155987465324886
    reg_lambda: 4.830514685501097
    n_estimators: 1000

runtime:
  min_tickers: 2

backtest:
  top_k: 15
  hold_days: 10
  fee_bps: 1.0
  slippage_bps: 10.0
  cost_model: realistic

risk_filters:
  trend_fast: 50
  trend_slow: 200
  vol_lookback: 20
  vol_high: 0.04
  allow_high_vol: false
  allow_downtrend: false
  max_positions: 12
  cooldown_days: 2

meta_labeling:
  enabled: false

